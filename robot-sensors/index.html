<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Sensor Challenge | Nipher Learning Lab</title><link rel="stylesheet" href="../shared/lab.css"><style>.option.selected{background:#ffecef;border-color:#b92430}.option{min-height:54px}</style></head><body><main id="app"></main><script src="../shared/lab.js"></script><script>"use strict";
const root=document.getElementById("app"),SENSORS=["Bumper switch","Color sensor","Distance sensor","Vision sensor"],CASES=[
["Stop at a wall","A robot must stop when its front bumper touches a barrier.",0,"Pressed","Stop motors","A bumper switch reports contact. Stop when pressed."],
["Sort red blocks","A conveyor should move a red block to the left bin.",1,"Red detected","Turn sorter left","A color sensor detects surface color; red triggers the sorter."],
["Avoid an obstacle","A robot approaching an obstacle must stop before touching it.",2,"Distance under 15 cm","Stop and turn","A distance sensor measures how far the object is, without needing contact."],
["Find the blue goal","A camera-equipped robot must locate a blue marker and turn toward it.",3,"Blue target seen","Turn toward target","A vision sensor finds objects from color signatures or trained recognition."],
["Detect a collision","A drive robot must reverse after physical contact.",0,"Pressed","Reverse briefly","Contact is the trigger; bumper sensors are binary switches."],
["Count green pieces","A machine should increment its count when a green object passes.",1,"Green detected","Add 1 to count","The color sensor helps distinguish target colors."],
["Keep a safe gap","A rover must maintain at least 20 cm from another rover.",2,"Distance under 20 cm","Slow down","Distance readings can be compared with a threshold."],
["Track a game element","A robot should rotate until a yellow game object appears in its camera.",3,"Yellow target seen","Stop rotating","Vision data can identify color signatures or objects in the camera's view."],
["Emergency bump stop","A mobile robot should stop if it strikes its safety bumper.",0,"Pressed","Stop motors","A bumper contact switch can trigger an emergency stop."],
["Identify a blue tile","A robot should beep when the floor sensor sees blue.",1,"Blue detected","Play beep","Color sensors interpret reflected light; lighting can affect readings."],
["Navigate toward a table","The robot must slow when the measured table distance drops below 30 cm.",2,"Distance under 30 cm","Slow down","A threshold turns a numeric distance reading into a decision."],
["Aim toward red flag","A vision-equipped robot must turn to align with a red flag.",3,"Red target seen","Turn toward target","Object recognition provides visual information for aiming."],
];
let settings=Lab.load("sensorChallengeTeacher",{rounds:4,hints:true}),level="Beginner",queue=[],at=0,points=0,history=[],chosenSensor="",trigger="",action="",hinted=false;
const TRIGGERS=["Pressed","Red detected","Green detected","Blue detected","Distance under 15 cm","Distance under 20 cm","Distance under 30 cm","Blue target seen","Yellow target seen","Red target seen"];
const ACTIONS=["Stop motors","Turn sorter left","Stop and turn","Turn toward target","Reverse briefly","Add 1 to count","Slow down","Stop rotating","Play beep"];
function home(){root.innerHTML=Lab.heading("Robotics","Robot Sensor Challenge","Choose the correct sensor, write a simple IF–THEN rule, and test robotic decisions.")+'<div class="card"><h2>Learn the sensors</h2><p><b>Bumper:</b> reports pressed/not pressed. <b>Color:</b> senses colors on a nearby surface. <b>Distance:</b> measures distance to obstacles. <b>Vision:</b> identifies visible targets or color signatures in a camera view.</p><p>Real sensors can be noisy and need calibration. This is a simplified decision-making activity, not real robot firmware.</p></div>'+Lab.levels()+'<p><button onclick="teacher()">⚙️ Teacher controls</button></p>';document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>begin(b.dataset.level))}
function begin(l){level=l;let pool=l==="Beginner"?CASES.slice(0,4):l==="Intermediate"?CASES.slice(0,8):CASES;queue=[...pool].sort(()=>Math.random()-.5).slice(0,settings.rounds);at=0;points=0;history=[];draw()}
function draw(){if(at>=queue.length)return finish();chosenSensor="";trigger="";action="";hinted=false;let c=queue[at];root.innerHTML=Lab.heading("Robotics",c[0],"Mission "+(at+1)+" of "+queue.length+" · "+level)+'<div class="card"><h2>Robot mission</h2><p>'+Lab.esc(c[1])+'</p><p class="muted">Build a rule: IF the sensor reports a condition, THEN the robot performs an action.</p></div><div class="split"><div class="card"><h2>1. Choose a sensor</h2><div class="grid">'+SENSORS.map(x=>'<button class="option" data-sensor="'+x+'">'+x+'</button>').join("")+'</div><h2>2. Choose a trigger</h2><select id="trigger"><option value="">Select condition</option>'+TRIGGERS.map(x=>'<option>'+x+'</option>').join("")+'</select></div><div class="card"><h2>3. Choose a response</h2><select id="action"><option value="">Select action</option>'+ACTIONS.map(x=>'<option>'+x+'</option>').join("")+'</select><div class="diagram"><h3>Your rule</h3><p id="rule">IF [sensor] senses [trigger], THEN [action].</p></div>'+(settings.hints?'<button id="hint">💡 Hint (−5)</button>':"")+'<p><button id="test" class="primary">▶ Test robot rule</button></p><div id="feedback"></div></div></div>';document.querySelectorAll("[data-sensor]").forEach(b=>b.onclick=()=>{chosenSensor=b.dataset.sensor;document.querySelectorAll("[data-sensor]").forEach(x=>x.classList.toggle("selected",x.dataset.sensor===chosenSensor));rule()});document.getElementById("trigger").onchange=e=>{trigger=e.target.value;rule()};document.getElementById("action").onchange=e=>{action=e.target.value;rule()};document.getElementById("test").onclick=test;if(settings.hints)document.getElementById("hint").onclick=()=>{hinted=true;document.getElementById("feedback").innerHTML='<div class="notice">Hint: '+Lab.esc(c[5])+'</div>'}}
function rule(){document.getElementById("rule").textContent="IF "+(chosenSensor||"[sensor]")+" reports "+(trigger||"[condition]")+", THEN "+(action||"[action]")+"."}
function test(){if(!chosenSensor||!trigger||!action)return alert("Choose a sensor, condition and action.");let c=queue[at],ok=[chosenSensor===SENSORS[c[2]],trigger===c[3],action===c[4]],score=Math.max(0,ok.filter(Boolean).length*30+10-(hinted?5:0));points+=score;history.push({mission:c[0],score,why:c[5]});document.getElementById("test").disabled=true;document.querySelectorAll("[data-sensor]").forEach(b=>b.disabled=true);document.getElementById("trigger").disabled=true;document.getElementById("action").disabled=true;document.getElementById("feedback").innerHTML='<div class="'+(ok.every(Boolean)?"notice":"warning")+'"><h3>'+(ok.every(Boolean)?"Robot mission completed!":"Debug the rule")+'</h3><p>Score: '+score+'/100. '+c[5]+'</p><p>Model solution: IF '+SENSORS[c[2]]+' reports '+c[3]+', THEN '+c[4]+'.</p><button class="primary" id="next">Next '+(at===queue.length-1?"— report":"mission")+' →</button></div>';document.getElementById("next").onclick=()=>{at++;draw()}}
function finish(){root.innerHTML=Lab.heading("Robotics","Sensor Engineering Report","Reflect on how sensors turn information into robot decisions.")+Lab.report("Robot Sensor Challenge",Math.round(points/queue.length),100,"Completed "+queue.length+" robotic decision missions.")+'<div class="card">'+history.map(h=>'<p><b>'+h.mission+': '+h.score+'/100.</b> '+h.why+'</p>').join("")+'</div><button onclick="home()" class="primary">Choose another challenge</button>'}
function teacher(){root.innerHTML=Lab.heading("Teacher controls","Robot Sensor Challenge","Settings stay on this browser.")+'<div class="card"><label>Tasks per round</label><select id="rounds">'+[3,4,6,8].map(n=>'<option '+(n===settings.rounds?"selected":"")+'>'+n+'</option>').join("")+'</select><label><input id="hints" type="checkbox" '+(settings.hints?"checked":"")+'> Allow hints</label><button onclick="saveTeacher()" class="primary">Save</button> <button onclick="home()">Cancel</button></div>'}
function saveTeacher(){settings.rounds=Number(document.getElementById("rounds").value);settings.hints=document.getElementById("hints").checked;Lab.save("sensorChallengeTeacher",settings);home()}home();</script></body></html>
