<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nipher Learning Lab | Medical Mystery</title>
<style>
:root{--red:#b91c1c;--navy:#16233b;--bg:#f4f6fb;--line:#d9dfeb;--ink:#172238}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);line-height:1.5}header{background:var(--navy);color:white;padding:18px max(20px,calc((100% - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}header b{font-size:1.2rem}header button{border:1px solid #8e9bb2;color:white;background:transparent}main{max-width:1060px;margin:30px auto;padding:0 18px}h1{font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.15;margin:8px 0}h2{margin:0 0 12px}.tag{color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.09em;font-size:.75rem}.lead{font-size:1.06rem;color:#4e5c71}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 4px 14px #19253b09}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.btn,button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;text-align:left;color:var(--ink)}button:hover{border-color:var(--red);background:#fff6f6}button:disabled{opacity:.5;cursor:default}.btn.primary,button.primary{color:white;background:var(--red);border-color:var(--red);text-align:center}.btn.primary:hover,button.primary:hover{background:#991b1b}.btn.selected,button.selected{border-color:var(--red);background:#fff0f0}.muted{color:#58677e;font-size:.9rem}.options{display:grid;gap:8px;margin:12px 0}.pill{display:inline-block;background:#e8edf5;border-radius:999px;padding:4px 9px;font-size:.75rem;font-weight:700;margin:4px 5px 4px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:680px){.split{grid-template-columns:1fr}header{flex-wrap:wrap}}.status{background:#e9f3f0;border:1px solid #b9dad0;border-radius:12px;padding:12px}.warn{background:#fff7e5;border:1px solid #edd7a4;border-radius:12px;padding:12px}input,select{font:inherit;border:1px solid #bbc5d6;padding:10px;border-radius:8px;max-width:100%}label{display:block;margin:10px 0}.small{font-size:.85rem}.progress{height:9px;background:#e5e9f0;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--red)}@media print{header,.no-print,button{display:none!important}body{background:white}.card{box-shadow:none}}
</style></head><body>
<header><b>🛡️ Nipher Interactive Learning Lab</b><button onclick="showSettings()">⚙️ Teacher settings</button></header>
<main id="app"></main>
<script>
"use strict";
const CASES=[
{id:"flu",level:"Beginner",title:"The Sudden Fever",patient:"Jordan, age 13",lead:"Fever, cough, body aches and sudden onset",answer:"Influenza",alternatives:["Strep throat","Seasonal allergies","Food poisoning"],questions:[["When did symptoms start?","Yesterday afternoon, very suddenly."],["Have others been sick?","Three teammates have had the flu."],["Do you have a cough?","Yes, a dry cough and headache."]],tests:[["Rapid influenza test",4,"Positive for influenza A."],["Rapid strep test",3,"Negative."],["Oxygen saturation",2,"98%, within expected range."]],reason:"Sudden fever, muscle aches, exposure history, and a positive influenza test support influenza."},
{id:"strep",level:"Beginner",title:"The Sore Throat",patient:"Avery, age 12",lead:"Sore throat, fever, and difficulty swallowing",answer:"Strep throat",alternatives:["Influenza","Seasonal allergies","Dehydration"],questions:[["Do you have a cough?","No, not really."],["When did it start?","Two days ago."],["Any other symptoms?","My neck feels tender."]],tests:[["Rapid strep test",4,"Positive for group A streptococcus."],["Flu test",3,"Negative."],["Temperature",2,"101.6°F."]],reason:"Fever, sore throat without cough, and a positive rapid strep result support strep throat."},
{id:"allergy",level:"Beginner",title:"The Sneezing Student",patient:"Riley, age 12",lead:"Sneezing, itchy eyes, and a runny nose",answer:"Seasonal allergies",alternatives:["Influenza","Strep throat","Cholera"],questions:[["When is it worse?","When I'm outside near the field."],["Do you have a fever?","No."],["Are your eyes bothering you?","They're really itchy."]],tests:[["Temperature",2,"98.4°F."],["Flu test",4,"Negative."],["Symptom log",2,"Symptoms worsen after outdoor pollen exposure."]],reason:"Itchy eyes, sneezing after pollen exposure, and no fever support seasonal allergies."},
{id:"dehydration",level:"Beginner",title:"The Dizzy Athlete",patient:"Sam, age 13",lead:"Dizziness after outdoor practice",answer:"Dehydration",alternatives:["Influenza","Seasonal allergies","Pneumonia"],questions:[["What have you had to drink?","Only a few sips of water."],["Have you been exercising?","I was outside in the heat for two hours."],["Any other symptoms?","My mouth is dry."]],tests:[["Urine color check",2,"Dark yellow urine."],["Pulse",2,"112 beats/min at rest."],["Temperature",2,"99°F."]],reason:"Heat exposure, limited fluid intake, dry mouth, and dark urine support dehydration."},
{id:"cholera",level:"Intermediate",title:"The Contaminated Water Clue",patient:"Taylor, age 14",lead:"Profuse watery diarrhea following a trip",answer:"Cholera",alternatives:["Salmonella infection","Seasonal allergies","Influenza"],questions:[["Where did you travel?","A community with limited clean water."],["What water did you drink?","Untreated well water."],["What are your symptoms?","Lots of watery diarrhea and thirst."]],tests:[["Stool laboratory test",5,"Vibrio cholerae identified."],["Hydration assessment",3,"Signs of significant fluid loss."],["Flu test",3,"Negative."]],reason:"Untreated water exposure, severe watery diarrhea, dehydration, and a supportive stool test point to cholera."},
{id:"salmonella",level:"Intermediate",title:"The Picnic Puzzle",patient:"Morgan, age 13",lead:"Fever, stomach cramps and diarrhea after a picnic",answer:"Salmonella infection",alternatives:["Cholera","Influenza","Strep throat"],questions:[["What did you eat?","Chicken at a picnic."],["Did anyone else get sick?","Two friends had stomach cramps too."],["When did symptoms start?","About a day after the picnic."]],tests:[["Stool culture",5,"Salmonella detected."],["Temperature",2,"101°F."],["Rapid strep test",3,"Negative."]],reason:"Shared food exposure, gastrointestinal symptoms, fever, and Salmonella in stool testing support this diagnosis."},
{id:"lyme",level:"Intermediate",title:"The Hiking Mystery",patient:"Casey, age 12",lead:"Fatigue, fever and an expanding rash after a hike",answer:"Early Lyme disease",alternatives:["Influenza","Seasonal allergies","Strep throat"],questions:[["Have you been outdoors?","I went hiking in a wooded area."],["Did you notice a bite?","I removed a small tick."],["How has the rash changed?","It has gotten bigger over several days."]],tests:[["Rash examination",3,"Expanding ring-like rash consistent with erythema migrans."],["Temperature",2,"100.5°F."],["Rapid strep test",3,"Negative."]],reason:"Tick exposure and a characteristic expanding rash support possible early Lyme disease; early laboratory tests may be negative."},
{id:"asthma",level:"Intermediate",title:"The Wheezing Runner",patient:"Alex, age 13",lead:"Coughing and wheezing during running",answer:"Possible exercise-induced asthma",alternatives:["Pneumonia","Cholera","Strep throat"],questions:[["When do symptoms happen?","During hard exercise."],["Do they improve when resting?","Usually after I stop running."],["Do you have a fever?","No."]],tests:[["Peak-flow comparison",4,"Airflow decreased after exercise."],["Oxygen saturation",2,"97% at rest."],["Temperature",2,"98.5°F."]],reason:"Recurrent exercise-related wheeze and decreased airflow suggest exercise-induced bronchoconstriction; clinical confirmation is needed."},
{id:"mono",level:"Advanced",title:"The Exhausted Student",patient:"Jamie, age 14",lead:"Weeks of fatigue, sore throat and swollen glands",answer:"Infectious mononucleosis",alternatives:["Influenza","Strep throat","Iron-deficiency anemia"],questions:[["How long have you been tired?","Several weeks."],["Are any glands swollen?","The ones in my neck are tender."],["Does rest help?","Not much."]],tests:[["Mononucleosis test",5,"Positive heterophile antibody test."],["Complete blood count",4,"Increased lymphocytes."],["Rapid strep test",3,"Negative."]],reason:"Prolonged fatigue, swollen glands, sore throat, and supportive testing suggest mononucleosis."},
{id:"norovirus",level:"Advanced",title:"The Field Trip Outbreak",patient:"Drew, age 13",lead:"Sudden vomiting and diarrhea after a group trip",answer:"Norovirus gastroenteritis",alternatives:["Cholera","Salmonella infection","Influenza"],questions:[["Did others become sick?","Several classmates began vomiting."],["How quickly did it start?","Suddenly, about a day later."],["What symptoms do you have?","Vomiting and watery diarrhea."]],tests:[["Exposure timeline",3,"Illness spread rapidly among close contacts."],["Norovirus stool PCR",5,"Norovirus detected."],["Flu test",3,"Negative."]],reason:"Sudden vomiting, short incubation, group spread, and norovirus detection support norovirus gastroenteritis."},
{id:"anemia",level:"Advanced",title:"The Low-Energy Mystery",patient:"Quinn, age 14",lead:"Fatigue, pallor and shortness of breath during activities",answer:"Iron-deficiency anemia",alternatives:["Infectious mononucleosis","Pneumonia","Influenza"],questions:[["How long has this been happening?","For several months."],["What foods do you eat?","Not many iron-rich foods."],["Do you have a fever?","No."]],tests:[["Complete blood count",4,"Hemoglobin below expected range; small red blood cells."],["Ferritin",5,"Low ferritin indicating low iron stores."],["Temperature",2,"98.6°F."]],reason:"Low hemoglobin and ferritin, fatigue, and pallor support iron-deficiency anemia; a clinician would investigate causes."},
{id:"pneumonia",level:"Advanced",title:"The Persistent Cough",patient:"Parker, age 13",lead:"Fever, cough, rapid breathing and chest discomfort",answer:"Pneumonia",alternatives:["Seasonal allergies","Iron-deficiency anemia","Strep throat"],questions:[["How long have you been coughing?","About a week and getting worse."],["Do you have fever?","Yes, especially at night."],["Does your chest hurt?","It hurts when I take a deep breath."]],tests:[["Chest X-ray",5,"Focal lung opacity consistent with pneumonia."],["Oxygen saturation",3,"93% on room air."],["Temperature",2,"102°F."]],reason:"Fever, progressive cough, chest pain and a supportive chest image suggest pneumonia."}];
const app=document.getElementById("app");const levels=["Beginner","Intermediate","Advanced"];
let settings=load("nipherSettings",{budget:12,hints:true,forced:"random"});let game=null;
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch(e){return fallback}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function header(title,subtitle){return '<div class="tag">Nipher Medical Detectives</div><h1>'+title+'</h1><p class="lead">'+subtitle+'</p>'}
function start(){game=null;app.innerHTML=header("Medical Mystery Diagnosis Simulator","Interview fictional patients, choose tests, collect evidence, and solve the case.")+'<div class="status">🧪 12 cases · 3 challenge levels · 100-point scoring · No student accounts required</div><h2 style="margin-top:24px">Choose a challenge level</h2><div class="grid">'+levels.map((l,i)=>'<div class="card"><span class="tag">'+l+'</span><h2>'+["Junior Detective","Clinical Investigator","Expert Investigator"][i]+'</h2><p>'+["Straightforward symptom clues and familiar conditions.","Connect exposure histories with diagnostic test results.","Interpret competing diagnoses and more complex evidence."][i]+'</p><button class="primary" onclick="begin(\''+l+'\')">Start '+l+' →</button></div>').join('')+'</div><p class="muted">Fictional classroom simulation only. Not medical advice or a real diagnostic tool.</p>'}
function begin(level){let pool=CASES.filter(c=>c.level===level);let forced=CASES.find(c=>c.id===settings.forced);let c=forced||pool[Math.floor(Math.random()*pool.length)];game={c,asked:[],tested:[],spent:0,diagnosis:"",evidence:[],hintsUsed:0,finished:false};play()}
function play(){if(!game)return start();let g=game,c=g.c,remaining=Math.max(0,settings.budget-g.spent);app.innerHTML=header(c.title,"Patient: "+escapeHtml(c.patient))+'<div class="card"><span class="pill">'+c.level+'</span><span class="pill">Test budget: '+remaining+' / '+settings.budget+' credits</span><p><b>Chief complaint:</b> '+escapeHtml(c.lead)+'</p></div><div class="split"><section class="card"><h2>1. Interview the patient</h2><div class="options">'+c.questions.map((q,i)=>'<button '+(g.asked.includes(i)?'class="selected"':'')+' onclick="ask('+i+')">'+escapeHtml(q[0])+'</button>'+(g.asked.includes(i)?'<p class="muted">↳ '+escapeHtml(q[1])+'</p>':'')).join('')+'</div></section><section class="card"><h2>2. Order tests</h2><div class="options">'+c.tests.map((t,i)=>'<button '+(g.tested.includes(i)?'class="selected"':"")+' '+(g.tested.includes(i)||t[1]>remaining?"disabled":"")+' onclick="test('+i+')">'+escapeHtml(t[0])+' · '+t[1]+' credits</button>'+(g.tested.includes(i)?'<p class="muted">↳ '+escapeHtml(t[2])+'</p>':'')).join('')+'</div></section></div><div class="card"><h2>3. Choose your diagnosis</h2><p class="muted">Use the clues and tests you collected to make an evidence-based decision.</p><div class="options">'+[c.answer,...c.alternatives].sort().map(d=>'<button '+(g.diagnosis===d?'class="selected"':'')+' onclick="pickDiagnosis('+JSON.stringify(d).replace(/"/g,"&quot;")+')">'+escapeHtml(d)+'</button>').join('')+'</div></div><div class="card"><h2>4. Select supporting evidence</h2><p class="muted">Select up to three findings that you investigated.</p><div class="options">'+[...g.asked.map(i=>["Interview: "+c.questions[i][0],c.questions[i][1]]),...g.tested.map(i=>["Test: "+c.tests[i][0],c.tests[i][2]])].map((e,i)=>'<button '+(g.evidence.includes(e[0])?'class="selected"':'')+' onclick="toggleEvidence('+JSON.stringify(e[0]).replace(/"/g,"&quot;")+')">'+escapeHtml(e[0])+' — '+escapeHtml(e[1])+'</button>').join('')+'</div>'+(settings.hints?'<button onclick="hint()">💡 Get a hint (costs points)</button>':'')+'<p id="hintArea" class="muted"></p><p><button class="primary" onclick="finish()" '+(!g.diagnosis?'disabled':'')+'>Submit diagnosis and view feedback →</button></p></div><p><button onclick="start()">← Choose another level</button></p>'}
function ask(i){if(!game.asked.includes(i))game.asked.push(i);play()}
function test(i){let g=game,t=g.c.tests[i];if(!g.tested.includes(i)&&g.spent+t[1]<=settings.budget){g.tested.push(i);g.spent+=t[1]}play()}
function pickDiagnosis(s){game.diagnosis=s;play()}
function toggleEvidence(s){let e=game.evidence;game.evidence=e.includes(s)?e.filter(x=>x!==s):e.length<3?[...e,s]:e;play()}
function hint(){game.hintsUsed++;let area=document.getElementById("hintArea");if(area)area.textContent="Hint: Compare the timeline, exposures, and the most specific test result."}
function finish(){let g=game;if(!g||!g.diagnosis)return;let correct=g.diagnosis===g.c.answer;let score=Math.max(0,(correct?60:10)+Math.min(15,g.asked.length*5)+Math.min(15,g.tested.length*5)+Math.min(10,g.evidence.length*4)-g.hintsUsed*5);g.finished=true;let title=correct?"Case solved!":"Keep investigating";app.innerHTML=header(title,"Your Medical Detectives case report")+'<div class="card"><span class="tag">Investigation results</span><h1>'+score+' / 100</h1><div class="progress"><span style="width:'+score+'%"></span></div><p class="'+(correct?'status':'warn')+'">'+(correct?"✅ Your diagnosis is supported by the case evidence.":"🔍 Your diagnosis needs another look. Review the case clues below.")+'</p><p><b>Your diagnosis:</b> '+escapeHtml(g.diagnosis)+'</p><p><b>Case explanation:</b> '+escapeHtml(g.c.reason)+'</p><p><b>Expected diagnosis:</b> '+escapeHtml(g.c.answer)+'</p><p><b>Score breakdown:</b> Diagnosis '+(correct?60:10)+'/60, interviews '+Math.min(15,g.asked.length*5)+'/15, tests '+Math.min(15,g.tested.length*5)+'/15, evidence '+Math.min(10,g.evidence.length*4)+'/10, hint penalty '+(g.hintsUsed*5)+' points.</p><p><b>Your selected evidence:</b> '+escapeHtml(g.evidence.join("; ")||"None selected")+'</p><p><b>Reflection:</b> What was your strongest piece of evidence? What would you investigate next?</p></div><div class="no-print"><button class="primary" onclick="begin('+JSON.stringify(g.c.level).replace(/"/g,"&quot;")+')">Try another case</button> <button onclick="window.print()">Print report</button> <button onclick="start()">Back to dashboard</button></div>'}
function showSettings(){app.innerHTML=header("Teacher settings","These settings apply only in this browser. Students can view the underlying case data, so this is for practice rather than secure testing.")+'<div class="card"><label>Testing budget <input id="budget" type="number" min="5" max="30" value="'+settings.budget+'"></label><label><input id="hints" type="checkbox" '+(settings.hints?'checked':'')+'> Allow hints</label><label>Choose case <select id="forced"><option value="random">Random within student-selected level</option>'+CASES.map(c=>'<option value="'+c.id+'" '+(settings.forced===c.id?'selected':'')+'>'+escapeHtml(c.level+" — "+c.title)+'</option>').join('')+'</select></label><button class="primary" onclick="saveSettings()">Save settings</button> <button onclick="start()">Back to student view</button></div><p class="muted">Teacher answer keys should be stored privately, not in this public repository.</p>'}
function saveSettings(){settings={budget:Math.max(5,Math.min(30,Number(document.getElementById("budget").value)||12)),hints:document.getElementById("hints").checked,forced:document.getElementById("forced").value};save("nipherSettings",settings);start()}
start();
</script></body></html>
