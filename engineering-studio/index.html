<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Design Studio | Nipher Learning Lab</title><link rel="stylesheet" href="../shared/lab.css"></head><body><main id="app"></main><script src="../shared/lab.js"></script><script>
"use strict";
const CHALLENGES=[
{id:"tower",level:"Beginner",name:"Build a Tall Tower",client:"A museum needs a tall model tower that remains standing.",goal:"Height",target:30,units:"cm",budget:25,materials:[["Cardboard",5,8,1],["Tape",3,2,3],["Straws",4,7,1],["Clay",6,1,8]],constraint:"Your design must use at least two different materials."},
{id:"boat",level:"Beginner",name:"Rescue Supply Raft",client:"A rescue team needs a raft model that can carry supplies.",goal:"Capacity",target:18,units:"tokens",budget:25,materials:[["Foam",7,8,2],["Cardboard",4,5,1],["Tape",3,2,3],["Straws",5,4,1]],constraint:"Choose at least two materials."},
{id:"shelter",level:"Beginner",name:"Rainproof Shelter",client:"Design a small emergency shelter for toy hikers.",goal:"Protection",target:25,units:"points",budget:25,materials:[["Plastic sheet",7,11,1],["Cardboard",4,6,1],["Tape",3,3,2],["String",2,1,4]],constraint:"Use a covering and a supporting material."},
{id:"bridge",level:"Intermediate",name:"Bridge Over the Creek",client:"Build a model bridge that spans a creek and holds a load.",goal:"Strength",target:37,units:"points",budget:32,materials:[["Craft sticks",6,10,2],["Cardboard",5,6,1],["Glue",4,3,4],["String",3,2,2]],constraint:"Explain how triangles or bracing improve strength."},
{id:"packaging",level:"Intermediate",name:"Protect the Package",client:"A delivery team wants a package that protects a fragile object.",goal:"Protection",target:35,units:"points",budget:32,materials:[["Bubble wrap",8,11,1],["Cardboard",5,7,3],["Paper",3,3,1],["Tape",4,5,2]],constraint:"Explain how your design absorbs impact."},
{id:"crane",level:"Intermediate",name:"Mini Lifting Crane",client:"An engineer needs a crane model to lift small loads.",goal:"Lifting",target:36,units:"points",budget:32,materials:[["String",4,6,1],["Spools",8,12,2],["Cardboard",5,6,2],["Tape",3,3,3]],constraint:"Explain the purpose of a mechanism."},
{id:"cooler",level:"Advanced",name:"Keep It Cool",client:"A field scientist needs a compact insulated sample carrier.",goal:"Insulation",target:48,units:"points",budget:40,materials:[["Foam",10,15,2],["Foil",6,7,1],["Cardboard",6,8,2],["Tape",3,3,2]],constraint:"Balance performance against material cost."},
{id:"vehicle",level:"Advanced",name:"Cargo Rover",client:"A team needs a small wheeled cargo vehicle for uneven ground.",goal:"Mobility",target:47,units:"points",budget:40,materials:[["Wheels",10,14,2],["Axles",8,12,2],["Cardboard",5,7,1],["Tape",3,2,2]],constraint:"Address friction and stability."},
{id:"filter",level:"Advanced",name:"Prototype Water Filter",client:"Create a model filter for investigating water clarity. Do not drink filtered water.",goal:"Filtering",target:45,units:"points",budget:40,materials:[["Filter paper",7,11,1],["Gravel",6,8,4],["Sand",5,7,3],["Bottle",5,5,2]],constraint:"Describe the test you would run and what the model cannot remove."}
];
const app=document.getElementById("app"),key="nipherDesign";let settings=Lab.load(key,{hints:true,rounds:1}),current=null,quantities=[0,0,0,0],iterations=0,tested=false,notes="",history=[];
function menu(){app.innerHTML=Lab.heading("Engineering & Design","Engineering Design Studio","Accept a client challenge, choose materials within a budget, test a simplified prototype, and improve it.")+'<div class="notice">This is a <b>design decision game</b>. Performance scores are illustrative, not real structural or material tests.</div>'+Lab.levels()+'<p><button onclick="teacher()">⚙️ Teacher settings</button></p>';document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>begin(b.dataset.level))}
function begin(level){let pool=CHALLENGES.filter(c=>c.level===level),c=pool[Math.floor(Math.random()*pool.length)];current=c;quantities=[0,0,0,0];iterations=0;tested=false;notes="";history=[];draw()}
function costs(){return quantities.reduce((n,q,i)=>n+q*current.materials[i][1],0)}
function performance(){let c=current,raw=quantities.reduce((n,q,i)=>n+q*c.materials[i][2],0),types=quantities.filter(q=>q>0).length;return Math.max(0,Math.round(raw+(types>=2?6:0)+(iterations?Math.min(8,iterations*3):0)))}
function draw(){let c=current;if(!c)return menu();let cost=costs();app.innerHTML=Lab.heading("Engineering & Design",c.name,c.level+" · Client: "+c.client)+'<div class="grid"><div class="card"><h2>Ask: Define the problem</h2><p><b>Goal:</b> '+c.goal+' — target '+c.target+' '+c.units+'</p><p><b>Budget:</b> '+c.budget+' credits</p><p><b>Constraint:</b> '+Lab.esc(c.constraint)+'</p><p class="muted small">This scoring model simplifies real testing.</p></div><div class="card"><h2>Plan: Your materials</h2>'+c.materials.map((m,i)=>'<div class="row"><b style="flex:1">'+Lab.esc(m[0])+'</b><span class="muted">'+m[1]+' credits each</span><button data-minus="'+i+'" aria-label="Remove '+Lab.esc(m[0])+'">−</button><b>'+quantities[i]+'</b><button data-plus="'+i+'" aria-label="Add '+Lab.esc(m[0])+'">+</button></div>').join("")+'<p class="pill">Cost: '+cost+' / '+c.budget+'</p><p class="muted small">Different materials often work better together.</p></div></div><div class="card"><h2>Imagine and plan</h2><label for="plan">Explain why you chose these materials and how they will work together</label><textarea id="plan" rows="3" placeholder="My design will...">'+Lab.esc(notes)+'</textarea><p><button id="test" class="primary">🧪 Test prototype</button> <button id="revise">Try an improvement</button></p><p class="muted">Iterations attempted: '+iterations+'</p><div id="result" aria-live="polite">'+(history.length?history.map(h=>'<p><b>Test '+h.number+':</b> '+h.performance+' '+c.units+' for '+h.cost+' credits. '+Lab.esc(h.feedback)+'</p>').join(""):"Run a test to see your simulated result.")+'</div></div><p><button onclick="menu()">← Choose another design challenge</button></p>';document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>change(+b.dataset.plus,1));document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>change(+b.dataset.minus,-1));document.getElementById("plan").oninput=e=>notes=e.target.value;document.getElementById("test").onclick=()=>test();document.getElementById("revise").onclick=()=>{iterations++;tested=false;draw()};}
function change(i,n){let next=Math.max(0,Math.min(4,quantities[i]+n));if(n>0&&costs()+current.materials[i][1]>current.budget)return alert("That material exceeds the available budget.");quantities[i]=next;tested=false;draw()}
function test(){if(!quantities.some(x=>x>0))return alert("Choose materials before testing.");let c=current,p=performance(),cost=costs(),good=p>=c.target,feedback=good?"Target reached in this simplified model.":"Below target. Consider stronger materials, different combinations, or an improvement.";tested=true;history.push({number:history.length+1,performance:p,cost,feedback});let score=Math.max(0,Math.min(100,(good?55:20)+(quantities.filter(x=>x>0).length>=2?10:0)+(notes.trim().length>=30?15:0)+(iterations>0?15:0)+(cost<=c.budget?5:0)));draw();document.getElementById("result").insertAdjacentHTML("beforeend",'<div class="'+(good?"notice":"warning")+'"><b>'+feedback+'</b><p>Score so far: '+score+' / 100</p><button class="primary" id="finish">Complete design report</button></div>');document.getElementById("finish").onclick=()=>report(score)}
function report(score){const c=current;app.innerHTML=Lab.heading("Design review","Your Engineering Report",c.name+" · "+c.level)+Lab.report(c.name,score,100,"Your last simulated design performance was "+performance()+" "+c.units+" toward a target of "+c.target+". Budget used: "+costs()+" / "+c.budget+". Iterations: "+iterations+".")+'<div class="card"><h2>Design explanation</h2><p>'+Lab.esc(notes||"No explanation provided.")+'</p><h2>Testing log</h2>'+history.map(h=>'<p>Test '+h.number+': '+h.performance+' '+c.units+' — '+Lab.esc(h.feedback)+'</p>').join("")+'</div><button class="primary" onclick="menu()">New client challenge</button>'}
function teacher(){app.innerHTML=Lab.heading("Teacher controls","Engineering Design Studio","Each challenge uses simplified performance points for decision-making practice, not engineering certification.")+'<div class="card"><p>Available challenges: '+CHALLENGES.length+' across three levels. Students plan, budget, test and iterate.</p><label><input id="hints" type="checkbox" '+(settings.hints?"checked":"")+'> Enable design prompts</label><button class="primary" onclick="saveTeacher()">Save settings</button> <button onclick="menu()">Cancel</button></div>'}
function saveTeacher(){settings.hints=document.getElementById("hints").checked;Lab.save(key,settings);menu()}
menu();
</script></body></html>
