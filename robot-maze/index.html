<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Coding Maze | Nipher Learning Lab</title><link rel="stylesheet" href="../shared/lab.css"><link rel="stylesheet" href="../shared/game-layer.css"></head><body><main id="app"></main><script src="../shared/lab.js"></script><script>
"use strict";
const MAPS={
Beginner:{start:[0,5],goal:[4,5],dir:1,walls:[[1,1],[2,1],[3,1],[1,3],[2,3],[4,3]],name:"First Steps"},
Intermediate:{start:[0,5],goal:[5,0],dir:0,walls:[[1,4],[2,4],[3,4],[4,4],[2,2],[3,2],[4,2],[1,1]],name:"Go Around"},
Advanced:{start:[0,5],goal:[5,0],dir:1,walls:[[3,5],[3,4],[1,2],[2,2],[3,2],[4,2],[4,3],[5,3],[2,4]],name:"Maze Master"}};
const app=document.getElementById("app"),settingsKey="nipherMaze";
let settings=Lab.load(settingsKey,{hints:true,maxSteps:45}),level="Beginner",attempts=0,last=null,display=null;
const DIRECTION=[[0,-1],[1,0],[0,1],[-1,0]],ARROW=["↑","→","↓","←"];
function menu(){app.innerHTML=Lab.heading("Robotics","Robot Coding Maze","Program a virtual robot using forward steps, turns, and repeat loops. The robot follows your instructions exactly.")+'<div class="notice"><b>Commands:</b> F = move forward one square, L = turn left, R = turn right. Example: REPEAT 3 { F }.</div>'+Lab.levels()+'<p><button onclick="teacher()">⚙️ Teacher settings</button></p>';document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>begin(b.dataset.level))}
function begin(l){level=l;attempts=0;last=null;display=null;show()}
function parse(code){let tokens=code.toUpperCase().replace(/#[^\n]*/g," ").match(/REPEAT|\d+|[FLR]|[{}]|[^\s{}]+/g)||[];let p=0;
function block(depth){if(depth>6)throw Error("Too many nested loops");let out=[];while(p<tokens.length){let t=tokens[p++];if(t==="}"){if(depth===0)throw Error("Unexpected }");return out}if(t==="REPEAT"){let n=Number(tokens[p++]);if(!Number.isInteger(n)||n<1||n>20)throw Error("REPEAT needs a number from 1 to 20");if(tokens[p++]!=="{")throw Error("Use { after REPEAT number");let nested=block(depth+1);for(let i=0;i<n;i++)out.push(...nested)}else if(["F","L","R"].includes(t)){out.push(t)}else{throw Error("Unknown command: "+t)}if(out.length>150)throw Error("Too many commands; simplify your program")}if(depth>0)throw Error("Missing closing }");return out}let result=block(0);if(p!==tokens.length)throw Error("Commands after closing }");if(!result.length)throw Error("Type at least one command");return result}
function simulate(commands){let m=MAPS[level],x=m.start[0],y=m.start[1],dir=m.dir,frames=[{x,y,dir}],wall=new Set(m.walls.map(p=>p.join(",")));for(let i=0;i<commands.length;i++){const cmd=commands[i];if(cmd==="L")dir=(dir+3)%4;if(cmd==="R")dir=(dir+1)%4;if(cmd==="F"){let nx=x+DIRECTION[dir][0],ny=y+DIRECTION[dir][1];if(nx<0||nx>5||ny<0||ny>5||wall.has(nx+","+ny))return {ok:false,reason:"Collision at step "+(i+1)+". The robot hit a wall or left the grid.",frames,steps:i+1};x=nx;y=ny}frames.push({x,y,dir});if(x===m.goal[0]&&y===m.goal[1])return {ok:true,reason:"Target reached!",frames,steps:i+1}}return {ok:false,reason:"Your robot stopped before reaching the green target.",frames,steps:commands.length}}
function board(state){let m=MAPS[level],walls=new Set(m.walls.map(p=>p.join(","))),html='<div class="cells" aria-label="Maze grid">';for(let y=0;y<6;y++)for(let x=0;x<6;x++){let atRobot=state&&state.x===x&&state.y===y,goal=m.goal[0]===x&&m.goal[1]===y,wall=walls.has(x+","+y);html+='<div class="cell '+(wall?"wall":goal?"goal":"")+' '+(atRobot?"robot":"")+'">'+(atRobot?ARROW[state.dir]:wall?"■":goal?"★":"")+'</div>'}return html+"</div>"}
function show(){const m=MAPS[level],state=display||{x:m.start[0],y:m.start[1],dir:m.dir};app.innerHTML=Lab.heading("Robotics","Robot Coding Maze — "+m.name,level+" level · Guide the robot to the green ★ target.")+'<div class="split"><section class="card"><h2>Maze field</h2><div class="diagram" id="maze">'+board(state)+'</div><p class="muted small">Yellow = robot · Green = goal · Dark = obstacle. Arrow shows robot direction.</p></section><section class="card"><h2>Write your program</h2><label for="program">Commands: F L R and REPEAT N { ... }</label><textarea id="program" class="codearea" rows="7" spellcheck="false">REPEAT 4 { F }</textarea><p class="row"><button class="primary" id="run">▶ Run program</button><button id="reset">Reset</button></p><p class="muted">Maximum executed steps: '+settings.maxSteps+'</p><div id="feedback" aria-live="polite"></div></section></div><div class="card"><b>Attempts:</b> <span id="tries">'+attempts+'</span> '+(settings.hints?'<button id="hint">💡 Hint</button>':'')+'<p id="hintText" class="muted"></p></div><p><button onclick="menu()">← Choose another level</button></p>';document.getElementById("run").onclick=()=>run();document.getElementById("reset").onclick=()=>{display=null;document.getElementById("maze").innerHTML=board({x:m.start[0],y:m.start[1],dir:m.dir});document.getElementById("feedback").innerHTML=""};if(settings.hints)document.getElementById("hint").onclick=()=>{document.getElementById("hintText").textContent=level==="Beginner"?"Start by moving forward. Use REPEAT to save typing.":level==="Intermediate"?"Try going north first, then turn right across the top row.":"Check which corridors are blocked before choosing your route."}}
function run(){const message=document.getElementById("feedback"),btn=document.getElementById("run");try{let instructions=parse(document.getElementById("program").value);if(instructions.length>settings.maxSteps)throw Error("Your program has "+instructions.length+" executed commands; limit is "+settings.maxSteps);attempts++;document.getElementById("tries").textContent=attempts;let result=simulate(instructions);last=result;btn.disabled=true;let i=0;function animate(){display=result.frames[i];document.getElementById("maze").innerHTML=board(display);if(i<result.frames.length-1){i++;setTimeout(animate,100)}else{btn.disabled=false;let pts=result.ok?Math.max(60,100-Math.max(0,attempts-1)*10-Math.max(0,result.steps-10)):Math.max(0,30-Math.max(0,attempts-1)*3);message.innerHTML='<div class="'+(result.ok?"notice":"warning")+'"><b>'+Lab.esc(result.reason)+'</b><p>Score: '+pts+' / 100 · Steps executed: '+result.steps+'.</p>'+(result.ok?'<p>Great! You used sequencing, directions, and debugging.</p><button onclick="report('+pts+')">View completion report</button>':'<p>Debug one command at a time, then try again.</p>')+'</div>'}}animate()}catch(e){message.innerHTML='<div class="warning"><b>Program error:</b> '+Lab.esc(e.message)+'</div>'}}
function report(score){app.innerHTML=Lab.heading("Robotics","Maze complete!","You successfully guided the robot through the field.")+Lab.report("Robot Coding Maze — "+level,score,100,"Attempts: "+attempts+". The program followed your instructions and reached the goal.")+'<button class="primary" onclick="menu()">Play another level</button>'}
function teacher(){app.innerHTML=Lab.heading("Teacher controls","Robot Coding Maze","Settings are local to this browser. These challenges use a simplified grid, not real-world robot physics.")+'<div class="card"><label for="max">Maximum executed commands</label><select id="max">'+[20,30,45,60,100].map(n=>'<option value="'+n+'" '+(settings.maxSteps===n?"selected":"")+'>'+n+'</option>').join("")+'</select><label><input type="checkbox" id="hints" '+(settings.hints?"checked":"")+'> Allow hints</label><p><button class="primary" onclick="saveTeacher()">Save settings</button> <button onclick="menu()">Cancel</button></p></div>'}
function saveTeacher(){settings={maxSteps:Number(document.getElementById("max").value),hints:document.getElementById("hints").checked};Lab.save(settingsKey,settings);menu()}
menu();
</script><script src="../shared/game-layer.js"></script></body></html>
