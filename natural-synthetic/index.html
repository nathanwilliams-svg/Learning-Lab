<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natural vs. Synthetic Lab | Nipher Learning Lab</title><link rel="stylesheet" href="../shared/lab.css"></head><body><main id="app"></main><script src="../shared/lab.js"></script><script>
"use strict";
const DATA=[
["cotton","Cotton T-shirt","Cotton fibers come from plants. The fibers are spun into yarn and made into fabric.","Natural","Beginner","Cotton grows on plants even though people process it into clothing."],
["plastic","Plastic water bottle","The bottle is made from PET plastic manufactured through chemical processes.","Synthetic","Beginner","PET plastic is a human-made polymer."],
["wood","Wooden ruler","This ruler is shaped from wood harvested from a tree.","Natural","Beginner","Wood comes from trees. Cutting and shaping it does not make wood synthetic."],
["nylon","Nylon rope","The rope contains manufactured nylon fibers.","Synthetic","Beginner","Nylon is a synthetic polymer made through chemical manufacturing."],
["wool","Wool sweater","Wool fibers are collected from sheep and woven into fabric.","Natural","Beginner","Wool is a natural animal fiber, even after processing."],
["glass","Glass jar","Sand and other minerals are heated together to make a new glass material.","Synthetic","Intermediate","Glass is manufactured by transforming raw minerals. In this lesson, manufactured glass is classified as synthetic."],
["paper","Paper notebook","Wood pulp is processed and pressed into paper sheets.","Natural","Intermediate","Paper is made from natural cellulose fibers. This classification uses the source fiber; paper is still manufactured."],
["polyester","Polyester jacket","Polyester fibers are produced through chemical synthesis.","Synthetic","Intermediate","Polyester is a synthetic fiber."],
["leather","Leather belt","Animal hide is chemically treated to make it durable.","Natural","Intermediate","Leather originates in animal hide, though tanning significantly processes it."],
["rubber","Rubber band","The label says synthetic rubber made from petroleum-derived chemicals.","Synthetic","Intermediate","Synthetic rubber is chemically manufactured; natural rubber also exists, so the label matters."],
["blend","Cotton-polyester hoodie","The label says 60% cotton and 40% polyester.","Both","Advanced","Cotton is a natural fiber; polyester is synthetic. Blends contain both."],
["rayon","Rayon scarf","Plant cellulose is chemically processed and regenerated into rayon fibers.","Both","Advanced","Rayon is regenerated cellulose from plants, but chemically manufactured. Natural-origin versus synthetic-processing definitions differ; the best classification here is mixed or depends on definition."],
["composite","Wood-plastic deck board","Wood flour is mixed with manufactured plastic to form the board.","Both","Advanced","The board combines natural wood particles with synthetic plastic."],
["foam","Foam cushion","The label lists polyurethane foam.","Synthetic","Advanced","Polyurethane is a manufactured polymer."],
["bioplastic","Plant-based PLA cup","Corn sugar is converted through industrial processing into PLA plastic.","Both","Advanced","PLA uses plant-derived feedstock but undergoes chemical manufacturing. Plant-based does not automatically mean natural."],
["silk","Silk necktie","Silk thread is produced by silkworms, then woven and dyed.","Natural","Intermediate","Silk originates from an animal; weaving and dyeing do not change the fiber's origin."],
["ceramic","Ceramic mug","Clay is shaped and fired into a hard ceramic.","Synthetic","Intermediate","Firing transforms clay into a manufactured ceramic; for this activity it is classified as synthetic."],
["cottonplastic","Reusable tote","The bag is cotton fabric with a plastic waterproof lining.","Both","Advanced","This product combines natural plant fibers and synthetic plastic."],
["steel","Steel spoon","Iron ore is processed with carbon to make a steel alloy.","Synthetic","Advanced","Steel is a manufactured alloy; classification depends on whether you mean raw origin or material manufacturing."],
["bamboo","Bamboo cutting board","Pieces of bamboo are cut, glued, and pressed into a board.","Natural","Intermediate","Bamboo grows naturally. The product is engineered, and glues may be synthetic; the main material is bamboo."]
];
const app=document.getElementById("app"),key="nipherNaturalLab";
let config=Lab.load(key,{hints:true,count:5}),round=[],index=0,points=0,history=[],currentLevel="Beginner";
function start(){app.innerHTML=Lab.heading("6th Grade Physical Science","Natural vs. Synthetic Materials Lab","Explore where materials come from, how they are made, and why some products are a mixture.")+'<div class="notice">Look for the <b>source material</b> and the <b>manufacturing process</b>. Some classifications depend on the definition you use.</div><h2>Choose a challenge</h2>'+Lab.levels()+'<p class="muted">Each round includes '+config.count+' scenarios. All explanations are revealed after you respond.</p><button onclick="teacher()">⚙️ Teacher settings</button>';document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>begin(b.dataset.level))}
function begin(level){currentLevel=level;let candidates=DATA.filter(d=>level==="Beginner"?d[3]==="Beginner":level==="Intermediate"?d[3]!=="Advanced":true);candidates=candidates.sort(()=>Math.random()-.5);round=candidates.slice(0,Math.min(config.count,candidates.length));index=0;points=0;history=[];show()}
function show(){if(index>=round.length)return finish();let d=round[index];app.innerHTML=Lab.heading("6th Grade Physical Science","Material Investigation","Case "+(index+1)+" of "+round.length+" · "+currentLevel)+'<div class="card"><span class="eyebrow">Examine the item</span><h2>'+Lab.esc(d[1])+'</h2><p>'+Lab.esc(d[2])+'</p><div class="diagram"><p>🔎 <strong>Question:</strong> Which classification best fits this material?</p></div><div class="grid" id="choices">'+["Natural","Synthetic","Both"].map(c=>'<button class="option" data-answer="'+c+'">'+c+'</button>').join("")+'</div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden">Next case →</button></div><div class="card"><span class="pill">Score: '+points+'</span><span class="pill">Level: '+currentLevel+'</span></div>';document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(b.dataset.answer));document.getElementById("next").onclick=()=>{index++;show()}}
function answer(a){let d=round[index],correct=a===d[3],earned=correct?20:0;points+=earned;history.push({item:d[1],answer:a,expected:d[3],reason:d[5],correct});document.querySelectorAll("[data-answer]").forEach(b=>{b.disabled=true;if(b.dataset.answer===d[3])b.classList.add("selected")});document.getElementById("feedback").innerHTML='<div class="'+(correct?"notice":"warning")+'"><b>'+(correct?"Correct! +20 points":"Not quite — +0 points")+'</b><p>'+Lab.esc(d[5])+'</p>'+(config.hints?'<p>Tip: Source and processing are different questions.</p>':"")+'</div>';document.getElementById("next").classList.remove("hidden")}
function finish(){app.innerHTML=Lab.heading("Investigation complete","Your Materials Report","Review your reasoning and identify one surprise.")+Lab.report("Natural vs. Synthetic Lab",points,round.length*20,points===round.length*20?"All classifications matched this lab's model!":"Read the explanations below, then try another level.")+'<div class="card"><h2>Case-by-case feedback</h2>'+history.map(h=>'<p><b>'+(h.correct?"✅":"🔎")+" "+Lab.esc(h.item)+'</b>: You chose '+Lab.esc(h.answer)+'. Model answer: '+Lab.esc(h.expected)+'. '+Lab.esc(h.reason)+'</p>').join("")+'</div><button class="primary" onclick="start()">Choose another challenge</button>'}
function teacher(){app.innerHTML=Lab.heading("Teacher controls","Natural vs. Synthetic Lab Settings","These settings are stored only in this browser and are not secure.")+'<div class="card"><label for="count">Questions per round</label><select id="count">'+[3,5,8,10].map(n=>'<option value="'+n+'" '+(config.count===n?"selected":"")+'>'+n+'</option>').join("")+'</select><label><input id="hints" type="checkbox" '+(config.hints?"checked":"")+'> Show extra tip after each answer</label><p class="muted small">Beginner covers familiar natural and synthetic materials; Intermediate adds processing and manufacturing; Advanced includes blends and definition-dependent materials.</p><button class="primary" onclick="saveSettings()">Save settings</button> <button onclick="start()">Cancel</button></div>'}
function saveSettings(){config={count:Number(document.getElementById("count").value),hints:document.getElementById("hints").checked};Lab.save(key,config);start()}
start();
</script></body></html>
