<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conservation of Mass Lab | Nipher Learning Lab</title><link rel="stylesheet" href="../shared/lab.css"><style>td,th{padding:8px;border:1px solid #d9e1ec;text-align:center}thead{background:#e8eef7}</style></head><body><main id="app"></main><script src="../shared/lab.js"></script><script>"use strict";
const ROOT=document.getElementById("app"),RX=[["Water forms","2 H₂ + O₂ → 2 H₂O",{"H":4,"O":2},{"H":4,"O":2},"The same four hydrogen atoms and two oxygen atoms appear on both sides."],["Methane burns","CH₄ + 2 O₂ → CO₂ + 2 H₂O",{"C":1,"H":4,"O":4},{"C":1,"H":4,"O":4},"Carbon, hydrogen, and oxygen atoms are rearranged but none are created or destroyed."],["Rust example","4 Fe + 3 O₂ → 2 Fe₂O₃",{"Fe":4,"O":6},{"Fe":4,"O":6},"Iron and oxygen atoms are conserved when iron oxide forms."],["Magnesium oxide","2 Mg + O₂ → 2 MgO",{"Mg":2,"O":2},{"Mg":2,"O":2},"The same magnesium and oxygen atoms remain after the reaction."],["Carbon dioxide","C + O₂ → CO₂",{"C":1,"O":2},{"C":1,"O":2},"All atoms from the reactants are represented in carbon dioxide."],["Ammonia","N₂ + 3 H₂ → 2 NH₃",{"N":2,"H":6},{"N":2,"H":6},"Two nitrogen and six hydrogen atoms are present on each side."],["Salt formation","2 Na + Cl₂ → 2 NaCl",{"Na":2,"Cl":2},{"Na":2,"Cl":2},"Sodium and chlorine are rearranged into sodium chloride."],["Hydrogen peroxide","2 H₂O₂ → 2 H₂O + O₂",{"H":4,"O":4},{"H":4,"O":4},"The oxygen and hydrogen atoms remain accounted for when peroxide decomposes."],["Calcium carbonate","CaCO₃ → CaO + CO₂",{"Ca":1,"C":1,"O":3},{"Ca":1,"C":1,"O":3},"Even when carbon dioxide gas escapes, its atoms remain part of the products."],["Iron and sulfur","Fe + S → FeS",{"Fe":1,"S":1},{"Fe":1,"S":1},"The same iron and sulfur atoms become iron sulfide."]];
let settings=Lab.load("massTeacher",{rounds:4,hints:true}),level="Beginner",queue=[],at=0,points=0,record=[],reactant=0,product=0,pred="",usedHint=false;
const TASKS=[
{name:"Closed flask",desc:"A sealed flask contains 28 g of reactants. After the reaction, the flask and its contents are weighed again.",reactants:28,products:28,open:false,why:"In a sealed system, total mass stays the same because matter cannot escape."},
{name:"Fizzing open cup",desc:"A cup contains 60 g of reacting ingredients. A gas escapes into the air before the remaining cup contents are weighed. (The cup's mass is excluded.)",reactants:60,products:54,open:true,why:"Only 54 g stays in the cup; 6 g of gas entered the surroundings. Total products still have a mass of 60 g."},
{name:"Rusting iron",desc:"A 40 g sample of iron reacts with oxygen from the surrounding air. The collected rust has a mass of 48 g.",reactants:48,products:48,open:true,why:"The original iron gained 8 g of oxygen atoms from the air; iron plus oxygen reactants together were 48 g."},
{name:"Sealed vinegar reaction",desc:"All gas is captured inside a sealed reaction system containing 75 g of reactants.",reactants:75,products:75,open:false,why:"All reaction products remain in the system, so the measured total stays 75 g."},
{name:"Heating in an open pan",desc:"The starting materials have a mass of 100 g. After heating, 13 g of vapor leaves the pan and 87 g remains.",reactants:100,products:87,open:true,why:"The 13 g of vapor is still matter; 87 g remaining plus 13 g vapor equals 100 g total."},
{name:"Gas in a balloon",desc:"A sealed flask and balloon together initially contain 50 g of chemicals. The balloon inflates during the reaction.",reactants:50,products:50,open:false,why:"The gas moves into the balloon, but the sealed combined system retains all 50 g."}
];
function home(){ROOT.innerHTML=Lab.heading("6th Grade Physical Science","Conservation of Mass Lab","Balance atom counts, investigate closed and open systems, and explain where mass goes.")+'<div class="card"><h2>Learn the science</h2><p>During a chemical reaction, atoms rearrange. <b>Atoms are not created or destroyed.</b> Therefore, the total mass of a closed system stays constant.</p><p>If gas escapes an open container, the contents may appear lighter, but the gas still has mass. If oxygen from the air joins a reaction, a solid may become heavier.</p><p>Always compare all reactants with all products, including gases and materials from the surroundings.</p></div>'+Lab.levels()+'<button onclick="teacher()">⚙️ Teacher controls</button>';document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>begin(b.dataset.level))}
function begin(l){level=l;let pool=l==="Beginner"?TASKS.slice(0,3):l==="Intermediate"?TASKS:RX.map((r,i)=>({rx:r}));queue=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(settings.rounds,pool.length));at=0;points=0;record=[];show()}
function show(){if(at>=queue.length)return finish();pred="";usedHint=false;let t=queue[at];if(t.rx)return atoms(t.rx);mass(t)}
function mass(t){ROOT.innerHTML=Lab.heading("Physical Science",t.name,"Investigation "+(at+1)+" of "+queue.length+" · "+level)+'<div class="card"><h2>Investigation evidence</h2><p>'+t.desc+'</p><div class="row"><span class="pill">Initial system: '+t.reactants+' g</span><span class="pill">After: '+t.products+' g measured in container</span><span class="pill">'+(t.open?"Open system":"Closed system")+'</span></div></div><div class="split"><div class="card"><h2>1. Predict the total product mass</h2><p>Include any gas that escaped or oxygen that entered from the air. What must the total products weigh?</p><label for="mass">Total mass of products (g)</label><input type="number" id="mass" min="0" step="1" placeholder="grams"><h2>2. Is mass conserved?</h2><select id="conserved"><option value="">Choose</option><option>Yes, including surroundings</option><option>No, mass disappeared</option></select></div><div class="card"><h2>3. Explain where the matter went</h2><textarea id="why" rows="4" placeholder="In a closed system... / The gas..."></textarea>'+(settings.hints?'<button id="hint">💡 Hint (−5)</button>':"")+'<p><button id="test" class="primary">Check investigation</button></p><div id="feedback"></div></div></div>';document.getElementById("test").onclick=()=>checkMass(t);if(settings.hints)document.getElementById("hint").onclick=()=>{usedHint=true;document.getElementById("feedback").innerHTML='<p class="notice">Hint: Include gases that enter or escape. Conservation applies to the whole reaction, not necessarily what remains in one cup.</p>'}}
function checkMass(t){let n=+document.getElementById("mass").value,c=document.getElementById("conserved").value,why=document.getElementById("why").value.trim();if(document.getElementById("mass").value.trim()===""||!c||why.length<15)return alert("Enter a total mass, make a claim, and write an explanation.");let score=Math.max(0,(Math.abs(n-t.reactants)<.01?50:0)+(c.startsWith("Yes")?30:0)+(why.length>=40?20:10)-(usedHint?5:0));points+=score;record.push({name:t.name,score,reason:t.why});document.getElementById("test").disabled=true;document.getElementById("feedback").innerHTML='<div class="'+(score>=75?"notice":"warning")+'"><h3>Scientific explanation</h3><p>Case score: '+score+'/100. Total product mass: <b>'+t.reactants+' g</b>.</p><p>'+t.why+'</p><button class="primary" id="next">Next '+(at+1===queue.length?"— report":"investigation")+' →</button></div>';document.getElementById("next").onclick=()=>{at++;show()}}
function atoms(r){let re=r[2],pr=r[3],elements=Object.keys(re),rows=elements.map(e=>'<tr><td>'+e+'</td><td>'+re[e]+'</td><td>'+pr[e]+'</td></tr>').join("");ROOT.innerHTML=Lab.heading("Physical Science",r[0],"Atom audit "+(at+1)+" / "+queue.length+" · Advanced")+'<div class="card"><h2>'+r[1]+'</h2><p>Atoms are represented by chemical symbols. The coefficients and subscripts show how many atoms are involved.</p><table style="width:100%;border-collapse:collapse"><thead><tr><th>Element</th><th>Reactant atoms</th><th>Product atoms</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="card"><h2>Count and explain</h2><label for="atom">How many total atoms are on the reactant side?</label><input id="atom" type="number" min="0" step="1"><label for="claim">Are the reactant and product atom counts balanced for each element?</label><select id="claim"><option value="">Choose</option><option>Yes</option><option>No</option></select><label for="why">Explain why the atoms are conserved</label><textarea id="why" rows="4" placeholder="I counted..."></textarea><p><button class="primary" id="test">Check atom audit</button></p><div id="feedback"></div></div>';document.getElementById("test").onclick=()=>{let number=document.getElementById("atom").value,claim=document.getElementById("claim").value,why=document.getElementById("why").value.trim();if(!number||!claim||why.length<15)return alert("Count atoms and explain your claim.");let sum=Object.values(re).reduce((a,b)=>a+b,0),score=(Number(number)===sum?50:0)+(claim==="Yes"?30:0)+(why.length>=40?20:10);points+=score;record.push({name:r[0],score,reason:r[4]});document.getElementById("test").disabled=true;document.getElementById("feedback").innerHTML='<div class="'+(score>=75?"notice":"warning")+'"><h3>Atom audit feedback</h3><p>Score: '+score+'/100. There are '+sum+' reactant atoms in the balanced equation.</p><p>'+r[4]+'</p><button class="primary" id="next">Next '+(at+1===queue.length?"— report":"audit")+' →</button></div>';document.getElementById("next").onclick=()=>{at++;show()}}}
function finish(){ROOT.innerHTML=Lab.heading("Physical Science","Conservation of Mass Report","Explain what your investigations reveal about atoms and matter.")+Lab.report("Conservation of Mass Lab",Math.round(points/queue.length),100,"You completed "+queue.length+" investigations.")+'<div class="card">'+record.map(x=>'<p><b>'+x.name+': '+x.score+'/100.</b> '+x.reason+'</p>').join("")+'</div><button class="primary" onclick="home()">Choose another level</button>'}
function teacher(){ROOT.innerHTML=Lab.heading("Teacher controls","Conservation of Mass Lab","Settings apply to this browser only.")+'<div class="card"><label>Investigations per round</label><select id="rounds">'+[2,3,4,6].map(n=>'<option '+(n===settings.rounds?"selected":"")+'>'+n+'</option>').join("")+'</select><label><input id="hints" type="checkbox" '+(settings.hints?"checked":"")+'> Enable hints</label><button class="primary" onclick="saveTeacher()">Save</button> <button onclick="home()">Cancel</button></div>'}
function saveTeacher(){settings.rounds=+document.getElementById("rounds").value;settings.hints=document.getElementById("hints").checked;Lab.save("massTeacher",settings);home()}home();</script></body></html>
