<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vital Signs Investigator | Nipher Learning Lab</title><link rel="stylesheet" href="../shared/lab.css"><style>.option{min-height:55px}.option.selected{border-color:#b92430;background:#ffecef}</style></head><body><main id="app"></main><script src="../shared/lab.js"></script><script>"use strict";
const CASES=[["After practice","A student feels dizzy after exercising in warm weather.",{"Temperature":"37.4 °C","Pulse":"118 bpm","Respiration":"25/min","Oxygen":"98%"},"Recent exertion and heat may help explain an increased pulse and breathing rate.","Ask about activity, water, symptoms, and recovery; have the student tell an adult."],["At rest","A student sits quietly and has no symptoms.",{"Temperature":"36.8 °C","Pulse":"76 bpm","Respiration":"16/min","Oxygen":"99%"},"Measurements are consistent with many healthy resting values, though context matters.","Note the conditions and compare with the person's usual readings."],["Fever and cough","A student reports chills and a persistent cough.",{"Temperature":"39.1 °C","Pulse":"112 bpm","Respiration":"24/min","Oxygen":"97%"},"Elevated temperature alongside symptoms merits adult attention; numbers alone do not diagnose an illness.","Tell a trusted adult or school nurse and report symptoms."],["Breathing difficulty","A student reports shortness of breath while resting.",{"Temperature":"37.0 °C","Pulse":"122 bpm","Respiration":"30/min","Oxygen":"90%"},"Breathing difficulty with a low oxygen reading is a potentially urgent situation.","Get immediate adult or emergency medical help; do not delay to complete an activity."],["After a short run","A student is measured immediately after a sprint.",{"Temperature":"37.1 °C","Pulse":"134 bpm","Respiration":"29/min","Oxygen":"98%"},"Activity normally increases heart and breathing rates; the recovery trend matters.","Record when the reading was taken and look for recovery while supervised."],["Cold classroom","A student has cold fingers and a pulse oximeter gives an inconsistent reading.",{"Temperature":"36.5 °C","Pulse":"80 bpm","Respiration":"17/min","Oxygen":"92%"},"Cold fingers and poor signal can make a pulse oximeter unreliable, so a reading must be checked with context.","Notify an adult, verify sensor placement and signal, and seek care if symptoms or low readings persist."],["Quiet reading","A student is seated calmly and talking normally.",{"Temperature":"36.9 °C","Pulse":"70 bpm","Respiration":"15/min","Oxygen":"99%"},"A single measurement is not a diagnosis; the student appears comfortable in this fictional scene.","Collect observations consistently and avoid unsupported conclusions."],["Feeling faint","A student feels lightheaded after standing quickly.",{"Temperature":"36.7 °C","Pulse":"108 bpm","Respiration":"20/min","Oxygen":"98%"},"Posture change and symptoms provide context; the pulse alone cannot explain the event.","Have the student sit safely and contact an adult or school nurse."],["Cough and fatigue","A student is tired, coughing, and breathing faster than usual.",{"Temperature":"38.7 °C","Pulse":"116 bpm","Respiration":"27/min","Oxygen":"94%"},"Several findings together suggest that the student should be assessed by a qualified adult or clinician.","Notify the nurse or caregiver promptly, especially if breathing worsens."],["Recovered after exercise","A student's pulse slows after several minutes of rest.",{"Temperature":"37.0 °C","Pulse":"88 bpm","Respiration":"18/min","Oxygen":"99%"},"A recovery trend can be more meaningful than a single post-exercise pulse.","Compare the resting and post-exercise measurements and document the timing."],["Fast heartbeat","A student reports a racing heartbeat while sitting.",{"Temperature":"36.8 °C","Pulse":"145 bpm","Respiration":"21/min","Oxygen":"98%"},"An unusually rapid reported heart rate at rest with symptoms needs adult attention.","Tell the nurse or another responsible adult promptly."],["Chilly and tired","A student feels cold but is alert and talking normally.",{"Temperature":"36.0 °C","Pulse":"78 bpm","Respiration":"16/min","Oxygen":"99%"},"A temperature reading can vary with the method and environment.","Ask which measurement method was used and whether the student has other symptoms."]],root=document.getElementById("app"),CATEGORIES=["Temperature","Pulse","Respiration","Oxygen"],ACTIONS=["Observe and document","Ask about context and repeat appropriately","Inform the school nurse or a responsible adult promptly","Seek immediate adult/emergency medical help"];
let settings=Lab.load("vitalsTeacher",{rounds:4,hints:true}),level="Beginner",pool=[],at=0,points=0,records=[],choice="",action="",hintUsed=false;
function home(){root.innerHTML=Lab.heading("Medical Detectives","Vital Signs Investigator","Explore fictional patient observations, recognize patterns, and choose a safe next step.")+'<div class="card"><h2>Read before investigating</h2><p><b>Temperature</b> describes body heat; <b>pulse</b> measures heartbeats per minute; <b>respiratory rate</b> counts breaths per minute; <b>oxygen saturation</b> estimates oxygen carried in the blood.</p><p>Readings depend on age, activity, health, equipment, and measurement conditions. <b>Numbers alone cannot diagnose a person.</b> If someone has difficulty breathing or severe symptoms, tell a responsible adult and seek urgent help.</p></div>'+Lab.levels()+'<button onclick="teacher()">⚙️ Teacher settings</button>';document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>begin(b.dataset.level))}
function begin(l){level=l;const options=l==="Beginner"?CASES.slice(0,4):l==="Intermediate"?CASES.slice(0,8):CASES;pool=[...options].sort(()=>Math.random()-.5).slice(0,settings.rounds);at=0;points=0;records=[];show()}
function expectedAction(c){if(c[0]==="Breathing difficulty")return 3;if(["Fever and cough","Cough and fatigue","Fast heartbeat"].includes(c[0]))return 2;if(["After practice","After a short run","Cold classroom","Feeling faint"].includes(c[0]))return 1;return 0}
function targetCategory(c){if(c[0]==="Breathing difficulty"||c[0]==="Cold classroom")return "Oxygen";if(["Fever and cough","Cough and fatigue"].includes(c[0]))return "Temperature";if(["After practice","After a short run","Recovered after exercise","Fast heartbeat","Feeling faint"].includes(c[0]))return "Pulse";return "Respiration"}
function show(){if(at>=pool.length)return finish();choice="";action="";hintUsed=false;const c=pool[at],v=c[2];root.innerHTML=Lab.heading("Medical Detectives",c[0],"Case "+(at+1)+" of "+pool.length+" · "+level)+'<div class="card"><h2>Patient report</h2><p>'+Lab.esc(c[1])+'</p><div class="grid">'+CATEGORIES.map(k=>'<div class="diagram"><b>'+k+'</b><h2>'+Lab.esc(v[k])+'</h2></div>').join("")+'</div><p class="muted small">These are fictional classroom examples, not diagnosis tools or universal normal ranges.</p></div><div class="split"><div class="card"><h2>1. Identify a key measurement</h2><p>Which measurement is most directly related to the central concern in this case?</p><div class="grid">'+CATEGORIES.map(k=>'<button class="option" data-measure="'+k+'">'+k+'</button>').join("")+'</div></div><div class="card"><h2>2. Choose a safe next step</h2><select id="action"><option value="">Select an action</option>'+ACTIONS.map(x=>'<option>'+x+'</option>').join("")+'</select><label for="why">Use patient context to explain your decision</label><textarea id="why" rows="4" placeholder="I noticed... and I would..."></textarea>'+(settings.hints?'<button id="hint">💡 Hint (−5)</button>':"")+'<p><button id="submit" class="primary">Submit investigation</button></p><div id="feedback" aria-live="polite"></div></div></div>';document.querySelectorAll("[data-measure]").forEach(b=>b.onclick=()=>{choice=b.dataset.measure;document.querySelectorAll("[data-measure]").forEach(x=>x.classList.toggle("selected",x.dataset.measure===choice))});document.getElementById("submit").onclick=submit;if(settings.hints)document.getElementById("hint").onclick=()=>{hintUsed=true;document.getElementById("feedback").innerHTML='<p class="notice">Hint: Consider symptoms and activity first, not just an isolated number. Safety comes before the assignment.</p>'}}
function submit(){const c=pool[at],action=document.getElementById("action").value,why=document.getElementById("why").value.trim();if(!choice||!action||why.length<15)return alert("Choose a measurement and an action, then explain your reasoning.");let good=choice===targetCategory(c),safe=action===ACTIONS[expectedAction(c)],pts=Math.max(0,(good?35:0)+(safe?45:0)+(why.length>=45?20:10)-(hintUsed?5:0));points+=pts;records.push({name:c[0],pts,measure:targetCategory(c),action:ACTIONS[expectedAction(c)],reason:c[3],next:c[4]});document.querySelectorAll("[data-measure]").forEach(x=>x.disabled=true);document.getElementById("action").disabled=true;document.getElementById("submit").disabled=true;document.getElementById("feedback").innerHTML='<div class="'+(good&&safe?"notice":"warning")+'"><h3>'+(good&&safe?"Good investigation":"Consider the full picture")+'</h3><p>Case score: '+pts+'/100. Key measurement: '+targetCategory(c)+'.</p><p><b>Evidence:</b> '+Lab.esc(c[3])+'</p><p><b>Suggested next step:</b> '+Lab.esc(c[4])+'</p><button class="primary" id="next">Next '+(at===pool.length-1?"— report":"case")+' →</button></div>';document.getElementById("next").onclick=()=>{at++;show()}}
function finish(){root.innerHTML=Lab.heading("Medical Detectives","Vital Signs Investigation Report","Consider how context changes the meaning of measurements.")+Lab.report("Vital Signs Investigator",Math.round(points/pool.length),100,"Completed "+pool.length+" fictional case investigations.")+'<div class="card">'+records.map(r=>'<p><b>'+r.name+': '+r.pts+'/100.</b> '+r.reason+'</p>').join("")+'</div><button onclick="home()" class="primary">Choose another level</button>'}
function teacher(){root.innerHTML=Lab.heading("Teacher controls","Vital Signs Investigator","Classroom practice; these are not clinical diagnostic rules.")+'<div class="card"><label>Cases per round</label><select id="rounds">'+[3,4,6,8].map(n=>'<option '+(n===settings.rounds?"selected":"")+'>'+n+'</option>').join("")+'</select><label><input id="hints" type="checkbox" '+(settings.hints?"checked":"")+'> Allow hints</label><button class="primary" onclick="saveTeacher()">Save</button> <button onclick="home()">Cancel</button></div>'}
function saveTeacher(){settings.rounds=+document.getElementById("rounds").value;settings.hints=document.getElementById("hints").checked;Lab.save("vitalsTeacher",settings);home()}home();</script></body></html>
