<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crane & Pulley Engineering Lab | Nipher Learning Lab</title><link rel="stylesheet" href="../shared/lab.css"><link rel="stylesheet" href="../shared/game-layer.css"></head><body><main id="app"></main><script src="../shared/lab.js"></script><script>"use strict";
const root=document.getElementById("app");
const MISSIONS=[
["Lift a toolbox","Lift a 20 N toolbox with no more than 12 N of ideal effort.",20,12,2],
["Raise a supply crate","Lift a 36 N crate with no more than 14 N of ideal effort.",36,14,3],
["Lift the robot chassis","Lift a 60 N chassis with no more than 15 N of ideal effort.",60,15,4],
["Lift competition parts","Lift a 24 N parts box using no more than 9 N.",24,9,3],
["Raise a small load","Lift an 18 N tool pack using no more than 10 N.",18,10,2],
["Heavy cargo","Lift an 80 N load with no more than 20 N of ideal effort.",80,20,4]
];
let settings=Lab.load("craneTeacher",{rounds:3,hints:true}),level="Beginner",queue=[],at=0,points=0,record=[],support=1,pred="",explanation="",usedHint=false;
function home(){root.innerHTML=Lab.heading("Engineering & Design","Crane & Pulley Engineering Lab","Design a virtual lifting system by changing the number of rope segments supporting the load.")+'<div class="card"><h2>Learn the lifting mechanics</h2><p><b>Ideal mechanical advantage (IMA)</b> equals the number of rope segments directly supporting the moving load in this simplified model. Ideal input force = weight ÷ IMA. The tradeoff: more rope must be pulled to lift the load the same distance.</p><p><b>Work tradeoff:</b> Ignoring friction, input work (force × rope distance) equals output work (load × lift height).</p><p class="muted">Real pulleys lose energy through friction. This simulation does not model pulley mounting, maximum rated loads, or safe hardware operation.</p></div>'+Lab.levels()+'<button onclick="teacher()">⚙️ Teacher controls</button>';document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>begin(b.dataset.level))}
function begin(l){level=l;let pool=l==="Beginner"?MISSIONS.filter((x,i)=>i===0||i===3||i===4):l==="Intermediate"?MISSIONS.slice(0,5):MISSIONS;queue=[...pool].sort(()=>Math.random()-.5).slice(0,settings.rounds);at=0;points=0;record=[];show()}
function show(){if(at>=queue.length)return finish();support=1;pred="";explanation="";usedHint=false;render()}
function render(){const m=queue[at],force=m[2]/support,rope=support*0.5;root.innerHTML=Lab.heading("Engineering & Design",m[0],"Lifting mission "+(at+1)+" of "+queue.length+" · "+level)+'<div class="card"><h2>Client challenge</h2><p>'+m[1]+'</p><div class="row"><span class="pill">Load '+m[2]+' N</span><span class="pill">Maximum ideal effort '+m[3]+' N</span><span class="pill">Lift height 0.5 m</span></div></div><div class="split"><div class="card"><h2>Build your ideal pulley system</h2><label for="segments">Rope segments supporting the load</label><select id="segments">'+[1,2,3,4,5,6].map(n=>'<option value="'+n+'" '+(n===support?"selected":"")+'>'+n+'</option>').join("")+'</select><div class="diagram"><svg viewBox="0 0 320 190" width="100%" role="img" aria-label="Simplified rope supports diagram"><rect x="95" y="142" width="130" height="28" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><text x="160" y="161" font-size="12" text-anchor="middle">Load</text>'+Array.from({length:support},(_,i)=>{let x=120+(i*(80/Math.max(1,support-1)));return '<line x1="'+x+'" y1="20" x2="'+x+'" y2="142" stroke="#b92430" stroke-width="4"/><circle cx="'+x+'" cy="20" r="5" fill="#233653"/>'}).join("")+'<path d="M75 20H245" stroke="#233653" stroke-width="9"/></svg><p class="muted small">Conceptual diagram only, not an assembly plan.</p></div></div><div class="card"><h2>Predict and test</h2><p><b>Ideal required force:</b> '+force.toFixed(1)+' N</p><p><b>Rope pulled for 0.5 m lift:</b> '+rope.toFixed(2)+' m</p><p><b>Ideal input work:</b> '+(force*rope).toFixed(1)+' J</p><p><b>Load work:</b> '+(m[2]*.5).toFixed(1)+' J</p><label for="predict">Will this setup meet the effort limit?</label><select id="predict"><option value="">Choose</option><option value="yes" '+(pred==="yes"?"selected":"")+'>Yes</option><option value="no" '+(pred==="no"?"selected":"")+'>No</option></select><label for="reason">Why do you expect this result?</label><textarea id="reason" rows="3" placeholder="If the mechanical advantage increases...">'+Lab.esc(explanation)+'</textarea>'+(settings.hints?'<button id="hint">💡 Hint (−5)</button>':"")+'<p><button class="primary" id="test">🧪 Test crane design</button></p><div id="response"></div></div></div>';document.getElementById("segments").onchange=e=>{pred=document.getElementById("predict").value;explanation=document.getElementById("reason").value;support=+e.target.value;render()};document.getElementById("predict").onchange=e=>{pred=e.target.value};document.getElementById("reason").oninput=e=>{explanation=e.target.value};document.getElementById("test").onclick=test;if(settings.hints)document.getElementById("hint").onclick=()=>{usedHint=true;document.getElementById("response").innerHTML='<p class="notice">The same load divided among more supporting segments requires less ideal pulling force, but a longer rope pull.</p>'}}
function test(){const m=queue[at],force=m[2]/support,success=force<=m[3],predict=document.getElementById("predict").value,reason=document.getElementById("reason").value.trim();if(!predict){document.getElementById("response").innerHTML='<div class="warning" role="alert">Choose Yes or No in the prediction menu before testing.</div>';return;}if(reason.length<15){document.getElementById("response").innerHTML='<div class="warning" role="alert">Your prediction is saved. Add a short explanation (at least 15 characters) before testing.</div>';return;}pred=predict;explanation=reason;let correct=predict===(success?"yes":"no"),score=Math.max(0,(success?55:15)+(correct?25:0)+(reason.length>=40?20:10)-(usedHint?5:0));points+=score;record.push({name:m[0],segments:support,force,success,score});document.getElementById("segments").disabled=true;document.getElementById("test").disabled=true;document.getElementById("response").innerHTML='<div class="'+(success?"notice":"warning")+'"><h3>'+(success?"Your crane meets the ideal target!":"Increase mechanical advantage")+'</h3><p>Ideal force: '+force.toFixed(1)+' N. '+(correct?"Your prediction was correct.":"Your prediction needs a second look.")+'</p><p>Score: '+score+'/100. More supports reduce ideal force, but require pulling proportionally more rope.</p><button class="primary" id="next">Next '+(at+1===queue.length?"— report":"mission")+' →</button></div>';document.getElementById("next").onclick=()=>{at++;show()}}
function finish(){root.innerHTML=Lab.heading("Engineering & Design","Crane Design Report","Reflect on force, distance, and ideal work.")+Lab.report("Crane & Pulley Lab",Math.round(points/queue.length),100,"Completed "+queue.length+" lifting designs. All calculations assume ideal, frictionless pulleys.")+'<div class="card">'+record.map(x=>'<p><b>'+x.name+': '+x.score+'/100</b> · '+x.segments+' supporting segments · '+x.force.toFixed(1)+' N ideal effort.</p>').join("")+'</div><button class="primary" onclick="home()">Choose another level</button>'}
function teacher(){root.innerHTML=Lab.heading("Teacher controls","Crane & Pulley Lab","Settings apply only to this browser.")+'<div class="card"><label>Challenges per round</label><select id="rounds">'+[1,2,3].map(n=>'<option '+(settings.rounds===n?"selected":"")+'>'+n+'</option>').join("")+'</select><label><input type="checkbox" id="hints" '+(settings.hints?"checked":"")+'> Allow hints</label><button onclick="saveTeacher()" class="primary">Save</button> <button onclick="home()">Cancel</button></div>'}
function saveTeacher(){settings.rounds=+document.getElementById("rounds").value;settings.hints=document.getElementById("hints").checked;Lab.save("craneTeacher",settings);home()}home();</script><script src="../shared/game-layer.js"></script></body></html>
